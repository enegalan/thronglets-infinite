name: release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'CHANGELOG.md'
    tags:
      - 'v*'

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      ${{
        github.ref_type == 'tag' || (
          github.event.head_commit.message != 'Update CHANGELOG' &&
          !startsWith(github.event.head_commit.message, 'chore: set application version to ')
        )
      }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute version tag
        id: version
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            NEXT_VERSION="$REF_NAME"
          else
            LATEST=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
            if [ -z "$LATEST" ]; then
              NEXT_VERSION="v1.0.0"
            else
              # Increment by 0.0.5 with decimal carry.
              NEXT_VERSION=$(echo "$LATEST" | sed 's/^v//' | awk -F. '{p=$3+5; m=$2; M=$1; if(p>=10){p=p-10; m=m+1;} if(m>=10){m=m-10; M=M+1;} printf "v%d.%d.%d\n", M, m, p}')
            fi
          fi
          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Sync project.godot version
        id: sync_version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          NUM="${VERSION#v}"
          HEAD_BRANCH="chore/set-version-$NUM"

          if grep -q '^config/version=' project.godot; then
            sed -i.bak -E "s|^config/version=.*|config/version=\"$NUM\"|" project.godot
            rm -f project.godot.bak
          else
            awk -v v="$NUM" '
              BEGIN{done=0}
              /^config\/icon=/ && !done { print; print "config/version=\"" v "\""; done=1; next }
              { print }
              END { if (!done) print "config/version=\"" v "\"" }
            ' project.godot > project.godot.tmp && mv project.godot.tmp project.godot
          fi

          if git diff --quiet -- project.godot; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # main requires a PR via repository ruleset; push to a side branch and merge.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$HEAD_BRANCH"
          git add project.godot
          git commit -m "chore: set application version to $NUM"
          git push -u origin HEAD:"$HEAD_BRANCH" --force

          EXISTING="$(gh pr list --head "$HEAD_BRANCH" --base "$BASE_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$EXISTING" ]; then
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$HEAD_BRANCH" \
              --title "chore: set application version to $NUM" \
              --body "Automated application version sync for \`$VERSION\`."
          fi

          gh pr merge --squash --delete-branch "$HEAD_BRANCH"

          git fetch origin "$BASE_BRANCH"
          git checkout "$BASE_BRANCH"
          git reset --hard "origin/$BASE_BRANCH"

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Tag the merge and push it
        if: github.ref_type == 'branch'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION="${{ steps.version.outputs.version }}"
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists"
          else
            git tag "$VERSION"
            git push origin "$VERSION"
          fi

      - name: Create GitHub Release and trigger changelog update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" \
              --title "$VERSION" \
              --target "$TARGET_BRANCH" \
              --generate-notes
          else
            echo "Release $VERSION already exists"
          fi

          # GITHUB_TOKEN-created releases do not trigger `release` workflows.
          # workflow_dispatch is an allowed follow-up trigger.
          gh workflow run "update changelog" \
            --ref "$TARGET_BRANCH" \
            -f version="$VERSION" \
            -f branch="$TARGET_BRANCH"
